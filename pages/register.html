<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>IMDB - Register</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <nav class="navbar">
    <a href="index.html" class="navbar-logo">IMDB</a>
    <div class="navbar-links" id="navbar-links"></div>
  </nav>

  <div class="container">
    <div class="auth-wrapper">
      <div class="auth-card">
        <h2>Register</h2>
        <div class="error-msg" id="error"></div>
        <form id="registerForm">
          <div class="form-group">
            <label>Username</label>
            <input type="text" class="form-input" id="username" required minlength="3" />
          </div>
          <div class="form-group">
            <label>Email</label>
            <input type="email" class="form-input" id="email" required />
          </div>
          <div class="form-group">
            <label>Password</label>
            <input type="password" class="form-input" id="password" required minlength="6" />
          </div>
          <button type="submit" class="btn btn-primary" style="width:100%">Register</button>
        </form>
        <p class="auth-footer">
          Already have an account? <a href="login.html">Login</a>
        </p>
      </div>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script>
    initPage().then(() => {
      if (currentUser) window.location.href = 'index.html';
    });

    document.getElementById('registerForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const errEl = document.getElementById('error');
      errEl.classList.remove('show');

      const username = document.getElementById('username').value;
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;

      try {
        const res = await api.register({ username, email, password });
        setToken(res.data.token);
        window.location.href = 'index.html';
      } catch (err) {
        errEl.textContent = err.message;
        errEl.classList.add('show');
      }
    });
  </script>
</body>
</html>
